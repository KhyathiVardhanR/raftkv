syntax = "proto3";

package raftkv;

option go_package = "raftkv/proto/raftkvpb";

// ---------------------------------------------------------------------------
// Raft peer-to-peer RPCs. Every message carries the shard (Raft group) id so a
// single gRPC connection between two nodes multiplexes all replica groups.
// ---------------------------------------------------------------------------

message Entry {
  uint64 index = 1;
  uint64 term = 2;
  bytes data = 3; // empty = leader no-op
}

message RequestVoteRequest {
  uint32 group = 1;
  uint64 term = 2;
  string candidate = 3;
  uint64 last_log_index = 4;
  uint64 last_log_term = 5;
  bool pre_vote = 6;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool granted = 2;
}

message AppendEntriesRequest {
  uint32 group = 1;
  uint64 term = 2;
  string leader = 3;
  uint64 prev_log_index = 4;
  uint64 prev_log_term = 5;
  repeated Entry entries = 6;
  uint64 leader_commit = 7;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  uint64 match_index = 3;
  uint64 conflict_index = 4;
}

message InstallSnapshotRequest {
  uint32 group = 1;
  uint64 term = 2;
  string leader = 3;
  uint64 last_included_index = 4;
  uint64 last_included_term = 5;
  bytes data = 6;
}

message InstallSnapshotResponse {
  uint64 term = 1;
}

service Raft {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
}

// ---------------------------------------------------------------------------
// Client-facing key-value API.
// ---------------------------------------------------------------------------

enum Code {
  OK = 0;
  NOT_LEADER = 1;   // retry against `leader`
  TIMEOUT = 2;      // outcome unknown
  WRONG_SHARD = 3;
}

message Header {
  Code code = 1;
  string leader = 2; // node id of the shard leader, if known
  uint32 shard = 3;
}

message GetRequest { bytes key = 1; }
message GetResponse { Header header = 1; bytes value = 2; bool found = 3; }

// Session fields make retried writes idempotent: the state machine applies
// each (client_id, request_id) at most once. min_outstanding lets the server
// forget request ids the client will never retry.
message Session {
  uint64 client_id = 1;
  uint64 request_id = 2;
  uint64 min_outstanding = 3;
}

message PutRequest { bytes key = 1; bytes value = 2; Session session = 3; }
message PutResponse { Header header = 1; }

message DeleteRequest { bytes key = 1; Session session = 2; }
message DeleteResponse { Header header = 1; }

message ClusterInfoRequest {}

message NodeInfo {
  string id = 1;
  string addr = 2;
}

message ShardInfo {
  uint32 shard = 1;
  string leader = 2;
  uint64 term = 3;
  uint64 commit_index = 4;
  uint64 applied_index = 5;
}

message ClusterInfoResponse {
  string node_id = 1;
  uint32 num_shards = 2;
  uint32 vnodes = 3;
  repeated NodeInfo nodes = 4;
  repeated ShardInfo shards = 5;
}

service KV {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc ClusterInfo(ClusterInfoRequest) returns (ClusterInfoResponse);
}
